:root{color-scheme:light}html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}body{margin:0;min-height:100vh}[hidden]{display:none!important}img{max-width:100%}button{touch-action:manipulation}

/* Layout: one phone-width column, sticky top bar, fixed tab bar; session types coded in barbell-plate colours */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#12151A; --ink-2:#4B525C; --ink-3:#6F7782;
  --line:#D6DAE0; --line-2:#E5E8EC;
  --push:#D93A2B; --pull:#2563D9; --box:#B98400; --run:#0E8F86;
  --good:#1D7F47; --warn:#9A5B00; --bad:#C2342A;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-data:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px; --r-sm:11px;
  --lift:0 1px 0 rgba(18,21,26,.04),0 10px 30px -18px rgba(18,21,26,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F12; --surface:#16191E; --surface-2:#1E2228; --ink:#EDF0F3; --ink-2:#A7AFB9; --ink-3:#7E8792;
  --line:#2C313A; --line-2:#22262D;
  --push:#E5564A; --pull:#4C82EE; --box:#B98C14; --run:#169F94;
  --good:#45B877; --warn:#E0A33A; --bad:#EF6A5E; --lift:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#16191E; --surface-2:#1E2228; --ink:#EDF0F3; --ink-2:#A7AFB9; --ink-3:#7E8792;
  --line:#2C313A; --line-2:#22262D;
  --push:#E5564A; --pull:#4C82EE; --box:#B98C14; --run:#169F94;
  --good:#45B877; --warn:#E0A33A; --bad:#EF6A5E; --lift:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.t-push{--c:var(--push);--on-c:#fff}.t-pull{--c:var(--pull);--on-c:#fff}
.t-box{--c:var(--box);--on-c:#17130A}.t-run{--c:var(--run);--on-c:#fff}
[class*="t-"]{--c-soft:color-mix(in oklab,var(--c) 13%,var(--surface));--c-line:color-mix(in oklab,var(--c) 40%,var(--surface))}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.mark{font:italic 800 26px/1 var(--font-display);letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.mark svg{width:26px;height:26px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.ok i{background:var(--good)}.sync.warn i{background:var(--warn)}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.eyebrow{font:600 12px/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.h1{font:800 44px/.92 var(--font-display);text-transform:uppercase;letter-spacing:-.005em;text-wrap:balance;margin:0}
.h2{font:800 26px/1 var(--font-display);text-transform:uppercase;margin:0;text-wrap:balance}
.h3{font:700 17px/1.2 var(--font-body);margin:0}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.small{font-size:14px}.tiny{font-size:12.5px}
.data{font-family:var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec>.eyebrow{display:flex;justify-content:space-between;align-items:baseline}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--lift);border:1px solid var(--line-2)}
.card.flat{box-shadow:none}
.card.tint{background:var(--c-soft);border-color:var(--c-line);box-shadow:none}

.btn{min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.c{background:var(--c);color:var(--on-c);border-color:var(--c)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:color-mix(in oklab,var(--bad) 45%,var(--surface))}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--ink-2);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}

.chip{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.c.on{background:var(--c);color:var(--on-c);border-color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* weight plate disc: hub, ring, colour */
.disc{width:30px;height:30px;flex:none;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 15%,color-mix(in oklab,var(--c) 55%,var(--surface)) 16% 30%,var(--c) 31% 100%)}
.disc.sm{width:14px;height:14px;background:radial-gradient(circle,var(--surface) 0 22%,var(--c) 23%)}
.disc.lg{width:46px;height:46px}
.disc.ghost{background:radial-gradient(circle,var(--surface) 0 22%,transparent 23%);box-shadow:inset 0 0 0 2px var(--c-line)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{min-height:46px;width:100%;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--ink);background:var(--surface)}
textarea.inp{padding:10px 12px;min-height:72px;resize:vertical}
.num{font-family:var(--font-data);text-align:center;padding:0 4px;font-size:16px;letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--ink)}.sw.on::after{transform:translateX(20px)}
.hr{height:1px;background:var(--line-2);border:0;margin:0}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:12px;color:var(--ink-2);border:1px solid transparent}
.day b{font:700 17px/1 var(--font-data);color:var(--ink)}
.day small{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.day.today{background:var(--surface);border-color:var(--line)}
.day.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.day.sel b{color:var(--surface)}
.dots{display:flex;gap:3px;min-height:12px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.dot.plan{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}

/* hero plan card */
.plan-hero{display:flex;flex-direction:column;gap:14px}
.plan-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.plan-row .h1{font-size:46px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--ink-2)}
.meta b{font-family:var(--font-data);font-weight:500;color:var(--ink);font-size:13.5px}
.done-badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--good)}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .r{text-align:right;font-family:var(--font-data);font-size:13.5px;color:var(--ink)}
.li .r small{display:block;font-family:var(--font-body);color:var(--ink-3);font-size:12.5px}
.up{color:var(--good);font-weight:700}

/* segmented progress */
.segbar{display:flex;gap:2px;height:8px}
.segbar i{flex:1;border-radius:999px;background:var(--line)}
.segbar i.on{background:var(--c)}

/* workout overlay */
.wo{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.wo-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.wo-head{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.clock{font:500 15px/1 var(--font-data);color:var(--ink-2)}
.ex{display:flex;flex-direction:column;gap:12px;padding:16px 14px}
.ex-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sug{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.35;padding:9px 11px;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.sug svg{width:18px;height:18px;flex:none;margin-top:1px}
.sug.up{background:color-mix(in oklab,var(--good) 13%,var(--surface));color:var(--ink)}
.sug.up svg{color:var(--good)}
.sug.low svg{color:var(--warn)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) 76px 60px 46px;gap:8px;align-items:center;padding:4px;border-radius:12px;margin:0 -4px}
.set.head{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-block:0}
.set.head span:nth-child(n+3){text-align:center}
.set .n{font:700 14px var(--font-data);color:var(--ink-3);text-align:center}
.set .prev{font:400 12.5px var(--font-data);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .inp{min-height:44px;height:44px}
.set.done{background:var(--c-soft)}
.set.done .inp{background:transparent;border-color:transparent;font-weight:700}
.chk{width:46px;height:44px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-3);background:var(--surface)}
.chk svg{width:22px;height:22px}
.set.done .chk{background:var(--c);border-color:var(--c);color:var(--on-c)}
.pr{display:inline-block;font:700 10px/1 var(--font-body);letter-spacing:.06em;padding:3px 5px;border-radius:5px;background:var(--ink);color:var(--surface);vertical-align:middle}
.ex-foot{display:flex;gap:8px;flex-wrap:wrap}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{max-width:576px;margin:0 auto;pointer-events:auto;background:var(--ink);color:var(--surface);border-radius:18px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5)}
.dock-in .btn{background:color-mix(in oklab,var(--surface) 14%,var(--ink));color:var(--surface);border-color:transparent;min-height:40px;padding:0 12px;font-size:15px}
.dock-in .btn.c{background:var(--c);color:var(--on-c)}
.dock-time{font:700 26px/1 var(--font-data);letter-spacing:-.04em}
.dock.alarm .dock-in{background:var(--c);color:var(--on-c)}
.ring{width:46px;height:46px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:color-mix(in oklab,var(--surface) 22%,transparent)}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .25s linear}

/* boxing timer */
.bt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px}
.bt-phase{font:800 22px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.bt-time{font:700 clamp(64px,22vw,104px)/1 var(--font-data);letter-spacing:-.06em}
.bt.warn .bt-time{color:var(--bad)}
.bt.rest .bt-phase{color:var(--ink-2)}
.pips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pip{width:22px;height:6px;border-radius:999px;background:var(--line)}
.pip.on{background:var(--c)}
.pip.now{background:color-mix(in oklab,var(--c) 45%,var(--line))}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);min-height:46px}
.stepper button{height:44px;font-size:22px;font-weight:600;color:var(--ink-2)}
.stepper span{text-align:center;font:600 15px var(--font-data)}
.bigread{font:700 40px/1 var(--font-data);letter-spacing:-.05em}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-2);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.resume{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:36;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.resume button{max-width:576px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;background:var(--c);color:var(--on-c);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}

/* sheets & toast */
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(8,10,12,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;margin:0 auto;width:fit-content;z-index:95;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);max-width:560px;display:flex;gap:10px;align-items:center;animation:up .2s ease-out}
.toast.pr{background:var(--box);color:#17130A}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font:600 30px/1.05 var(--font-body);letter-spacing:-.01em}
.tile b small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:3px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:500 10.5px var(--font-data);fill:var(--ink-3)}
.chart .lbl{fill:var(--ink);font-weight:700;font-size:11.5px}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translateX(-50%);z-index:3}
.tip b{font-family:var(--font-data);font-size:14px}
.tip .k{display:inline-block;width:12px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
details.tbl summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3);list-style:none}
details.tbl summary::-webkit-details-marker{display:none}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
td.n{font-family:var(--font-data);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}
th.n{text-align:right}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);font-size:14px}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.coach{white-space:pre-wrap;font-size:15px;line-height:1.5}
.plates{display:flex;align-items:center;justify-content:center;gap:2px;height:130px;padding:6px 0}
.plates .bar{height:14px;width:56px;border-radius:3px;background:linear-gradient(var(--ink-3),var(--ink-2))}
.plates .collar{height:30px;width:10px;border-radius:3px;background:var(--ink-2)}
.plate{border-radius:5px;display:grid;place-items:center;font:700 10px var(--font-data);writing-mode:vertical-rl;transform:rotate(180deg)}
.edit-ex{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.h1{font-size:52px}.plan-row .h1{font-size:54px}}

.splash{min-height:100vh;display:grid;place-items:center}.splash svg{width:72px;height:72px}
.ob{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.ob-hero{font:italic 800 clamp(54px,17vw,84px)/.86 var(--font-display);text-transform:uppercase;letter-spacing:-.01em;margin:0;text-wrap:balance}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line-2)}
.opt.on{border-color:var(--ink)}
.opt .tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.opt.on .tick{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt .tick svg{width:16px;height:16px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.lib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2);text-align:left;width:100%}
.lib-row .plus{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.lib-row .plus svg{width:18px;height:18px}
.steps-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.top .btn.sm{min-height:34px}
.sheet>*{flex-shrink:0}
.restchip{font:600 12px/1 var(--font-data);letter-spacing:-.02em;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 9px;min-height:28px}
.restchip[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip svg{width:16px;height:16px;flex:none}.btn svg{width:18px;height:18px;flex:none}
</style>

<script>
const { html, render, useState, useEffect, useRef, useMemo } = htmPreact;

/* ---------- helpers ---------- */
const pad2 = n => String(n).padStart(2, '0');
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const round2 = x => Math.round(x * 100) / 100;
const DAY_S = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const DAY_L = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MON_L = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const wIdx = d => (d.getDay() + 6) % 7; // Mo=0 … So=6
function dkey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDkey(k) { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) { return addDays(d, -wIdx(d)); }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
const nfKg = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
const nfInt = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1, minimumFractionDigits: 0 });
const fmtKg = n => (n == null || isNaN(n) ? '–' : nfKg.format(round2(n)));
const fmtInt = n => nfInt.format(Math.round(n || 0));
const fmt1 = n => nf1.format(Math.round((n || 0) * 10) / 10);
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(',', '.');
  if (s === '' || s === '.' || s === '-') return null;
  const n = Number(s); return isFinite(n) ? n : null;
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? h + ':' + pad2(m) + ':' + pad2(s) : m + ':' + pad2(s);
}
function fmtMin(sec) { const m = Math.round((sec || 0) / 60); return m >= 60 ? Math.floor(m / 60) + ' h ' + pad2(m % 60) + ' min' : m + ' min'; }
function parseDur(str) {
  if (str == null) return null;
  const p = String(str).trim().replace(/[.,]/g, ':').split(':');
  if (!p.length || p.some(x => x.trim() === '' || isNaN(Number(x)))) return null;
  const n = p.map(Number);
  if (n.length === 1) return Math.round(n[0] * 60);
  if (n.length === 2) return n[0] * 60 + n[1];
  if (n.length === 3) return n[0] * 3600 + n[1] * 60 + n[2];
  return null;
}
function paceSec(km, sec) { return km > 0 && sec > 0 ? sec / km : null; }
function fmtPace(p) { if (!p) return '–'; const s = Math.round(p); return Math.floor(s / 60) + ':' + pad2(s % 60); }
function dateShort(k) { const d = parseDkey(k); return DAY_S[wIdx(d)] + ', ' + pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.'; }
function dateLong(d) { return DAY_L[wIdx(d)] + ', ' + d.getDate() + '. ' + MON_L[d.getMonth()]; }

    if (b.phase === 'prep') { b.phase = 'round'; b.round = 1; b.end += b.cfg.round * 1000; b.warned = false; sound = 'start'; }
    else if (b.phase === 'round') {
      b.done = b.round;
      if (b.round >= b.cfg.rounds) { b.phase = 'done'; sound = 'end'; }
      else if (b.cfg.rest > 0) { b.phase = 'rest'; b.end += b.cfg.rest * 1000; b.cd = 0; sound = 'end'; }
      else { b.round++; b.end += b.cfg.round * 1000; b.warned = false; sound = 'start'; }
    } else if (b.phase === 'rest') { b.phase = 'round'; b.round++; b.end += b.cfg.round * 1000; b.warned = false; sound = 'start'; }
  }
  const left = b.end - now;
  if (b.phase === 'round' && !b.warned && b.cfg.warn > 0 && left <= b.cfg.warn * 1000 && left > 0) { b.warned = true; if (!sound) sound = 'warn'; }
  if ((b.phase === 'rest' || b.phase === 'prep') && left <= 3000 && left > 0) { const sec = Math.ceil(left / 1000); if (sec !== b.cd) { b.cd = sec; if (!sound) sound = 'tick'; } }
  if (sound === 'start') { bell(1); buzz(350); }
  else if (sound === 'end') { bell(3); buzz([300, 120, 300, 120, 300]); }
  else if (sound === 'warn') { clack(2); buzz(90); }
  else if (sound === 'tick') beep([620], 0.08);
  if (b.phase === 'done') {
    b.running = false;
    if (S.active && S.active.kind === 'boxen') { S.active.box.rounds = b.done; S.active.box.round = b.cfg.round; S.active.box.rest = b.cfg.rest; saveActive(); }
    toast('Alle ' + b.done + ' Runden geschafft');

  }
}

/* ---------- stats ---------- */
function weekStart(n) { return addDays(mondayOf(new Date()), -7 * (n - 1)); }
function inRange(list, from) { const k = dkey(from); return list.filter(s => s.date >= k); }
function weekIndex(s, from) { return Math.floor((parseDkey(s.date) - from) / (7 * 86400000) + 1e-6); }
function computeStats(src, nWeeks) {
  const from = weekStart(nWeeks), list = inRange(sortedSessions(src), from);
  const weeks = Array.from({ length: nWeeks }, (_, i) => { const d = addDays(from, i * 7); return { d, kw: isoWeek(d), byColor: { push: 0, pull: 0, box: 0, run: 0 }, km: 0, rounds: 0, vol: 0 }; });
  let vol = 0, km = 0, rounds = 0, runSec = 0;
  for (const s of list) {
    const w = weeks[weekIndex(s, from)]; if (!w) continue;
    w.byColor[s.color] = (w.byColor[s.color] || 0) + 1;
    if (s.kind === 'kraft') { const v = sessVolume(s); vol += v; w.vol += v; }
    if (s.kind === 'lauf') { km += s.run.km || 0; runSec += s.run.sec || 0; w.km += s.run.km || 0; }
    if (s.kind === 'boxen') { rounds += s.box.rounds || 0; w.rounds += s.box.rounds || 0; }
  }
  return { from, list, weeks, count: list.length, vol, km, rounds, runSec, perWeek: list.length / nWeeks };
}
function exerciseSeries(src, exId) {
  const pts = [];
  for (const s of sortedSessions(src).slice().reverse()) {
    if (s.kind !== 'kraft') continue;
    const e = (s.ex || []).find(x => x.id === exId); if (!e || !e.sets.length) continue;
    let best = 0, bs = null;
    for (const st of e.sets) { const v = e1rm(loadOf(e, st.w), st.r); if (v > best) { best = v; bs = st; } }
    pts.push({ date: s.date, y: round2(best), set: bs, bw: e.bw });
  }
  return pts;
}
function exerciseIndex(src) {
  const map = {};
  for (const s of sortedSessions(src)) {
    if (s.kind !== 'kraft') continue;
    for (const e of s.ex || []) {
      const m = map[e.id] || (map[e.id] = { id: e.id, name: e.name, bw: e.bw, n: 0, best: 0, bestSet: null, bestDate: null, last: s.date });
      m.n++;
      for (const st of e.sets) { const v = e1rm(loadOf(e, st.w), st.r); if (v > m.best) { m.best = v; m.bestSet = st; m.bestDate = s.date; } }
    }
  }
  return Object.values(map).sort((a, b) => b.n - a.n);
}

      ${doneSel.map(s => html`<button class=${'card tint t-' + s.color} style="text-align:left" onClick=${() => { S.tab = 'verlauf'; S.openId = s.id; commit(); }}>

            : isToday ? html`<div class="row" style="gap:8px"><button class="btn c grow" onClick=${() => startSession(t.id, tk)}>${t.name} starten</button><button class="btn" onClick=${() => startSession(t.id, tk, 'log')}>Nachtragen</button></div>`
            : html`<button class="btn c block" onClick=${() => startSession(t.id, tk)}>Jetzt starten</button>`}

      <div class="chips" aria-label="Andere Einheit starten">
        ${S.settings.templates.filter(t => !plannedAll.includes(t)).map(t => html`<button class=${'chip t-' + t.color} onClick=${() => (isPast ? startSession(t.id, selKey, 'log') : startSession(t.id, tk))}><span class="disc sm"></span>${t.name}</button>`)}
        <button class="chip" onClick=${() => { S.sheet = { type: 'logPick', date: isPast || isToday ? selKey : tk }; commit(); }}>${I.plus} Einheit nachtragen</button>
      </div>
    </section>

    <section class="sec" aria-label="Woche">

          <span class="r up">${c.bw ? (sg.prevW > 0 ? '+' + fmtKg(sg.prevW) : 'KG') : fmtKg(sg.prevW)} → ${c.bw ? '+' : ''}${fmtKg(sg.w)} kg</span></div>`)}</div>`

        <span class="r">${sessMetric(last).main}<small>${sessMetric(last).sub}</small></span></button>

function PlanMeta({ t }) {
  if (t.kind === 'kraft') { const sets = t.exercises.reduce((n, e) => n + (e.sets || 0), 0); const sec = t.exercises.reduce((n, e) => n + (e.sets || 0) * ((e.rest || 90) + 45), 0); return html`<span><b>${t.exercises.length}</b> Übungen</span><span><b>${sets}</b> Sätze</span><span>ca. <b>${Math.round(sec / 60)}</b> min</span>`; }
  if (t.kind === 'boxen') return html`<span><b>${t.box.rounds} × ${fmtDur(t.box.round)}</b> Runden</span><span><b>${fmtDur(t.box.rest)}</b> Pause</span><span>${t.box.art}</span>`;
  if (t.kind === 'lauf') { const l = sortedSessions().find(s => s.kind === 'lauf' && s.tpl === t.id), r = l && cardioRate(l.run); return html`<span>${t.run.act || 'Laufen'}</span><span>Ziel <b>${fmt1(t.run.km)} km</b></span><span>${t.run.art}</span>${r ? html`<span>zuletzt <b>${r.main}</b> ${r.unit}</span>` : null}`; }
  return null;
}


/* ---------- workout overlay ---------- */

function KraftLog({ a }) {
  return html`<div class="stack">
    ${a.ex.map((e, ei) => html`<${ExCard} key=${e.id + ei} a=${a} e=${e} ei=${ei} />`)}
    <button class="btn ghost block" onClick=${() => { S.sheet = { type: 'addEx' }; commit(); }}>${I.plus} Übung hinzufügen</button>
  </div>`;
}
function ExCard({ a, e, ei }) {

  return html`<div class="card ex">
    <div class="ex-title"><div class="grow"><div class="h3">${e.name}</div>
      <div class="row wrap" style="gap:4px 8px;margin-top:4px"><span class="tiny faint data" style="letter-spacing:0">${e.sets.length} × ${e.lo}–${e.hi} · +${fmtKg(e.inc)} kg</span>
        ${!quiet(a) && html`<button class="restchip" aria-expanded=${restOpen ? 'true' : 'false'} onClick=${() => setRestOpen(!restOpen)}>Pause ${fmtDur(restFor(e))}${auto ? ' · auto' : ''}</button>`}</div></div>
      ${e.bar && html`<button class="btn sm ghost" onClick=${() => { const w = (e.sets.find(s => !s.done) || e.sets[0]).w; S.sheet = { type: 'plates', w: w || S.settings.prefs.bar }; commit(); }}>Scheiben</button>`}

        : html`<div class="row between" style="gap:10px"><span class="small">Pause zwischen den Sätzen</span><div style="width:150px"><${Stepper} label="Pause" value=${e.rest || 90} min=${15} max=${600} step=${15} fmt=${fmtDur} onChange=${v => setExRest(e, v)} /></div></div>
          <p class="tiny faint" style="margin:0">Gilt für diese Übung, auch in deinem Plan. Die Pause hängt nicht von den Wiederholungen ab, außer du schaltest das unter Plan → Erweitert ein.</p>`}
    </div>`}
    ${e.sug && html`<div class=${'sug ' + e.sug.mode}>${sugIcon}<span>${e.sug.text}</span></div>`}
    <div class="sets">
      <div class="set head" aria-hidden="true"><span></span><span>Vorher</span><span>${e.bw ? '+kg' : 'kg'}</span><span>Wdh</span><span></span></div>
      ${e.sets.map((s, si) => html`<div class=${'set' + (s.done ? ' done' : '')} key=${si}>
        <span class="n">${s.pr ? html`<span class="pr">PR</span>` : si + 1}</span>
        <span class="prev">${pw(e.prev[si])}</span>
        <${NumInput} id=${'w-' + a.id + '-' + ei + '-' + si} label=${'Satz ' + (si + 1) + ' Gewicht'} value=${s.w} placeholder=${e.bw ? '0' : 'kg'}
          onChange=${v => { s.w = v; if (s.done && v == null) s.done = false; touch(); }} />
        <${NumInput} id=${'r-' + a.id + '-' + ei + '-' + si} label=${'Satz ' + (si + 1) + ' Wiederholungen'} decimals=${false} value=${s.r} placeholder=${s.tr}
          onChange=${v => { s.r = v == null ? null : Math.round(v); touch(); }} />
        <button class="chk" aria-label=${'Satz ' + (si + 1) + (s.done ? ' zurücksetzen' : ' abhaken')} aria-pressed=${s.done ? 'true' : 'false'} onClick=${() => toggleSet(ei, si)}>${I.check}</button>

      ${a.log && e.sets.some(s => !s.done) && html`<button class="btn sm" onClick=${() => fillTargets(ei)}>Ziel übernehmen</button>`}

}
function RestDock() {
  const r = S.rest, left = Math.max(0, (r.end - Date.now()) / 1000), over = left <= 0;
  const C = 2 * Math.PI * 19, frac = r.total ? Math.min(1, left / r.total) : 0;
  return html`<div class=${'dock t-' + S.active.color + (over ? ' alarm' : '')} role="timer" aria-live="off">
    <div class="dock-in">
      <svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle class="bgc" cx="23" cy="23" r="19"/>
        <circle class="fg" cx="23" cy="23" r="19" stroke-dasharray=${C} stroke-dashoffset=${C * (1 - frac)} transform="rotate(-90 23 23)"/></svg>
      <div class="grow"><div class="dock-time">${over ? 'Los!' : fmtDur(Math.ceil(left))}</div><div class="tiny" style="opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${over ? 'Nächster Satz' : 'Pause · ' + r.label}</div></div>
      ${!over && html`<button class="btn" aria-label="15 Sekunden weniger" onClick=${() => shiftRest(-15)}>−15</button><button class="btn" aria-label="15 Sekunden mehr" onClick=${() => shiftRest(15)}>+15</button>`}
      <button class="btn c" onClick=${() => { S.rest = null; commit(); }}>${over ? 'OK' : 'Weiter'}</button>
    </div></div>`;
}

/* ---------- boxing ---------- */
const BOX_ARTS = ['Sandsack', 'Pratzen', 'Sparring', 'Schattenboxen', 'Technik', 'Kondition', 'Seilspringen'];
function BoxLog({ a }) {
  const b = S.bt, cfg = b.cfg, now = Date.now();
  const left = b.running ? (b.paused ? b.left : Math.max(0, b.end - now)) : (b.phase === 'done' ? 0 : cfg.round * 1000);
  const phaseDur = b.phase === 'prep' ? cfg.prep : b.phase === 'rest' ? cfg.rest : cfg.round;
  const frac = b.running ? Math.min(1, left / (phaseDur * 1000)) : 1;
  const label = !b.running && b.phase !== 'done' ? 'Bereit' : b.phase === 'prep' ? 'Gleich geht’s los' : b.phase === 'rest' ? 'Pause · gleich Runde ' + (b.round + 1) : b.phase === 'done' ? 'Fertig' : 'Runde ' + b.round + ' / ' + cfg.rounds;
  const warn = b.running && b.phase === 'round' && left <= cfg.warn * 1000;
  const C = 2 * Math.PI * 120;
  const setCfg = (k, v) => { if (b.running) return; b.cfg = { ...b.cfg, [k]: v }; commit(); };
  return html`<div class="stack">
    ${!quiet(a) && html`<div class="card" style="padding:0">
      <div class=${'bt' + (warn ? ' warn' : '') + (b.phase === 'rest' ? ' rest' : '')} role="timer">
        <div class="bt-phase">${label}</div>
        <div style="position:relative;width:min(100%,280px);aspect-ratio:1;display:grid;place-items:center;max-width:100%">
          <svg viewBox="0 0 260 260" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
            <circle cx="130" cy="130" r="120" fill="none" stroke="var(--line-2)" stroke-width="10"/>
            <circle cx="130" cy="130" r="120" fill="none" stroke=${b.phase === 'rest' || b.phase === 'prep' ? 'var(--ink-3)' : 'var(--c)'} stroke-width="10" stroke-linecap="round"
              stroke-dasharray=${C} stroke-dashoffset=${C * (1 - frac)} transform="rotate(-90 130 130)" style="transition:stroke-dashoffset .25s linear"/></svg>
          <div class="bt-time">${fmtDur(Math.ceil(left / 1000))}</div>
        </div>
        <div class="pips" aria-label=${(b.done || 0) + ' von ' + cfg.rounds + ' Runden'}>${Array.from({ length: cfg.rounds }, (_, i) => html`<i class=${'pip' + (i < (b.done || 0) ? ' on' : (b.running && b.phase === 'round' && i === b.round - 1 ? ' now' : ''))}></i>`)}</div>
      </div>
      <div class="row" style="padding:0 16px 16px;gap:8px">
        ${!b.running ? html`<button class="btn c grow" onClick=${btStart}>${b.phase === 'done' ? 'Neu starten' : 'Timer starten'}</button>`
          : html`<button class="btn c grow" onClick=${btPause}>${b.paused ? 'Weiter' : 'Pause'}</button>
                 <button class="btn" onClick=${btSkip}>Überspringen</button><button class="btn" onClick=${btStop}>Stopp</button>`}
      </div>
    </div>`}
    ${!b.running && !quiet(a) && html`<div class="card stack" style="gap:12px">
      <div class="eyebrow">Timer</div>
      <div class="grid2">
        <label class="field"><span>Runden</span><${Stepper} label="Runden" value=${cfg.rounds} min=${1} max=${30} onChange=${v => setCfg('rounds', v)} /></label>
        <label class="field"><span>Rundenlänge</span><${Stepper} label="Rundenlänge" value=${cfg.round} min=${30} max=${600} step=${30} fmt=${fmtDur} onChange=${v => setCfg('round', v)} /></label>
        <label class="field"><span>Pause</span><${Stepper} label="Pause" value=${cfg.rest} min=${0} max=${300} step=${15} fmt=${fmtDur} onChange=${v => setCfg('rest', v)} /></label>
        <label class="field"><span>Warnsignal</span><${Stepper} label="Warnsignal vor Rundenende" value=${cfg.warn} min=${0} max=${30} step=${5} fmt=${v => (v ? v + ' s' : 'aus')} onChange=${v => setCfg('warn', v)} /></label>
      </div>
      <p class="tiny faint" style="margin:0">Gong zum Start, dreifacher Gong zum Rundenende, Klacken ${cfg.warn || 10} s vorher. Der Bildschirm bleibt an, solange der Timer läuft.</p>
    </div>`}
    <div class="card stack" style="gap:12px">
      <div class="eyebrow">Eintrag</div>
      <div class="chips">${BOX_ARTS.map(x => html`<button class=${'chip c' + (a.box.art === x ? ' on' : '')} onClick=${() => { a.box.art = x; touch(); }}>${x}</button>`)}</div>
      <div class="grid2">
        <label class="field"><span>Runden</span><${NumInput} id=${'box-r-' + a.id} decimals=${false} value=${a.box.rounds} placeholder=${cfg.rounds} onChange=${v => { a.box.rounds = v == null ? null : Math.round(v); touch(); }} /></label>
        <label class="field"><span>Rundenlänge (m:ss)</span><${DurInput} id=${'box-l-' + a.id} value=${a.box.round} onChange=${v => { if (v) { a.box.round = v; touch(); } }} /></label>
      </div>
      <label class="field"><span>Anstrengung (RPE)</span><${RPE} value=${a.box.rpe} onChange=${v => { a.box.rpe = v; touch(); }} /></label>
    </div>
  </div>`;
}

/* ---------- cardio ---------- */
const RUN_ARTS = ['Locker', 'Tempo', 'Intervalle', 'Lang', 'Wettkampf'];
function RunLog({ a }) {
  const r = a.run, act = r.act || 'Laufen', A = ACTS[act] || ACTS.Laufen, rate = cardioRate(r);
  const pace = x => (x && x.km > 0 && x.sec > 0 ? x.sec / x.km : null);
  const same = sortedSessions().filter(s => s.kind === 'lauf' && s.id !== a.id && ((s.run && s.run.act) || 'Laufen') === act);
  const bestPace = same.filter(s => s.run.km >= 3).reduce((m, s) => Math.min(m, pace(s.run) || 1e9), 1e9);
  const longest = same.reduce((m, s) => Math.max(m, s.run.km || 0), 0);
  const cur = pace(r);
  const [dur, setDur] = useState(r.sec ? fmtDur(r.sec) : '');
  const best = bestPace < 1e9 ? cardioRate({ act, km: 1, sec: bestPace }) : null;
  return html`<div class="stack">
    <div class="card stack" style="gap:14px">
      <div class="field"><span>Sportart</span><div class="chips">${Object.keys(ACTS).map(x => html`<button class=${'chip c' + (act === x ? ' on' : '')} onClick=${() => { r.act = x; touch(); }}>${x}</button>`)}</div></div>
      <div class="field"><span>Art</span><div class="chips">${RUN_ARTS.map(x => html`<button class=${'chip c' + (r.art === x ? ' on' : '')} onClick=${() => { r.art = x; touch(); }}>${x}</button>`)}</div></div>
      <div class="grid2">
        <label class="field"><span>Distanz (km)</span><${NumInput} id=${'run-km-' + a.id} value=${r.km} placeholder="5,0" onChange=${v => { r.km = v; touch(); }} /></label>
        <label class="field"><span>Zeit (mm:ss)</span><input id=${'run-t-' + a.id} class="inp num" inputmode="decimal" autocomplete="off" placeholder="28:30" value=${dur}
          onInput=${e => { setDur(e.target.value); r.sec = parseDur(e.target.value); touch(); }} /></label>
      </div>
      <div class="row between" style="align-items:flex-end">
        <div><div class="eyebrow">${A.speed ? 'Tempo' : 'Pace'}</div><div class="bigread">${rate.main}<span class="small faint" style="font-family:var(--font-body);letter-spacing:0"> ${rate.unit}</span></div></div>
        ${!A.speed && html`<div style="text-align:right"><div class="eyebrow">Schnitt</div><div class="data" style="font-size:18px">${cur ? fmt1(3600 / cur) : '–'} km/h</div></div>`}

/* ---------- charts ---------- */

    try { ro = new ResizeObserver(upd); ro.observe(el); } catch (e) { window.addEventListener('resize', upd); }
    return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', upd); };

}
function niceStep(span, n) { const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }

const topRounded = (x, y, w, h, r) => { r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
const COLOR_NAMES = { push: 'Rot', pull: 'Blau', box: 'Gold', run: 'Petrol' };
function colorName(c) { const n = S.settings.templates.filter(t => t.color === c).map(t => t.name); return n.length ? n.join(' / ') : COLOR_NAMES[c]; }

function Columns({ cols, keys, fmt = v => fmt1(v), unit = '', h = 170, label }) {
  const [ref, w] = useWidth(); const [hi, setHi] = useState(null);
  const L = 30, R = 6, T = 16, B = 22, pw = w - L - R, ph = h - T - B, n = cols.length;
  const max = Math.max(0, ...cols.map(c => c.total)); const ticks = ticksFor(0, max || 1, 3); const top = ticks[ticks.length - 1];
  const band = pw / n, bw = Math.max(3, Math.min(24, band * 0.64)), y = v => T + ph - (v / top) * ph;
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 38))));
  const pick = ev => { const r = ref.current.getBoundingClientRect(); const i = Math.floor((ev.clientX - r.left - L) / band); setHi(i >= 0 && i < n ? i : null); };
  const tipX = hi == null ? 0 : Math.min(Math.max(L + band * hi + band / 2, 70), w - 70);
  return html`<div class="chart" ref=${ref}>
    <svg width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} role="img" aria-label=${label} tabindex="0"
      onPointerMove=${pick} onPointerDown=${pick} onPointerLeave=${() => setHi(null)} onBlur=${() => setHi(null)}
      onKeyDown=${e => { if (e.key === 'ArrowRight') setHi(Math.min(n - 1, (hi == null ? -1 : hi) + 1)); if (e.key === 'ArrowLeft') setHi(Math.max(0, (hi == null ? n : hi) - 1)); }}>
      ${ticks.map(t => html`<g><line class="grid" x1=${L} x2=${w - R} y1=${y(t)} y2=${y(t)}/><text x=${L - 6} y=${y(t) + 3.5} text-anchor="end">${fmt(t)}</text></g>`)}

      })}

    </svg>
    ${hi != null && cols[hi] && html`<div class="tip" style=${`left:${tipX}px`}>

      ${keys.filter(k => cols[hi].parts[k] > 0).map(k => html`<div class=${'t-' + k}><span class="k"></span><b>${fmt(cols[hi].parts[k])}${unit}</b> ${keys.length > 1 ? colorName(k) : ''}</div>`)}

    </div>`}
  </div>`;
}
function LineChart({ pts, color, fmt = fmt1, unit = '', h = 190, label }) {

  const L = 36, R = 54, T = 14, B = 22, pw = w - L - R, ph = h - T - B;

  const X = t => (x1 === x0 ? L + pw / 2 : L + ((t - x0) / (x1 - x0)) * pw), Y = v => T + ph - ((v - lo) / (top - lo)) * ph;

      onPointerMove=${pick} onPointerDown=${pick} onPointerLeave=${() => setHi(null)} onBlur=${() => setHi(null)}
      onKeyDown=${e => { if (e.key === 'ArrowRight') setHi(Math.min(P.length - 1, (hi == null ? -1 : hi) + 1)); if (e.key === 'ArrowLeft') setHi(Math.max(0, (hi == null ? P.length : hi) - 1)); }}>
      ${ticks.map(t => html`<g><line class="grid" x1=${L} x2=${w - R + 8} y1=${Y(t)} y2=${Y(t)}/><text x=${L - 6} y=${Y(t) + 3.5} text-anchor="end">${fmtInt(t)}</text></g>`)}

      ${hi != null && html`<line x1=${P[hi][0]} x2=${P[hi][0]} y1=${T} y2=${T + ph} stroke="var(--ink-3)" stroke-width="1"/><circle cx=${P[hi][0]} cy=${P[hi][1]} r="5" fill="var(--c)" stroke="var(--surface)" stroke-width="2"/>`}
    </svg>
    ${hi != null && html`<div class="tip" style=${`left:${Math.min(Math.max(P[hi][0], 70), w - 70)}px`}>
      <div class="tiny" style="opacity:.75">${dateShort(pts[hi].date)}</div>

    else if (ss.length === 1) shape = html`<rect x=${x} y=${y} width=${cell} height=${cell} rx="2" fill=${'var(--' + ss[0].color + ')'}/>`;
    else shape = html`<g><path d=${`M${x},${y}H${x + cell}L${x},${y + cell}Z`} fill=${'var(--' + ss[0].color + ')'}/><path d=${`M${x + cell},${y}V${y + cell}H${x}Z`} fill=${'var(--' + ss[1].color + ')'}/></g>`;
    cells.push(html`<g opacity=${hi && hi.k !== k ? 0.55 : 1} onPointerDown=${() => setHi({ k, x: x + cell / 2, y, ss })} onPointerEnter=${() => setHi({ k, x: x + cell / 2, y, ss })}>${shape}</g>`);
  }
  return html`<div class="chart" ref=${ref} onPointerLeave=${() => setHi(null)}>
    <svg width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} role="img" aria-label="Trainingstage als Kalender">
      ${['Mo', '', 'Mi', '', 'Fr', '', 'So'].map((t, d) => t && html`<text x="0" y=${d * (cell + gap) + cell / 2 + 3.5}>${t}</text>`)}
      ${cells}
      ${Array.from({ length: n }, (_, wk) => { const d = addDays(from, wk * 7); return (wk % Math.max(1, Math.ceil(n / 6)) === 0) && html`<text x=${L + wk * (cell + gap)} y=${h - 3}>${d.getDate() <= 7 || wk === 0 ? MON_L[d.getMonth()].slice(0, 3) : ''}</text>`; })}
    </svg>
    ${hi && html`<div class="tip" style=${`left:${Math.min(Math.max(hi.x, 70), w - 70)}px;top:${hi.y + cell + 8}px`}>
      <div class="tiny" style="opacity:.75">${dateShort(hi.k)}</div>
      ${hi.ss.length ? hi.ss.map(s => html`<div class=${'t-' + s.color}><span class="k"></span><b>${s.name}</b> ${sessMetric(s).main}</div>`) : html`<div>Kein Training</div>`}
    </div>`}
  </div>`;
}
function Legend({ keys }) { return html`<div class="legend">${keys.map(k => html`<span class=${'t-' + k}><i></i>${colorName(k)}</span>`)}</div>`; }
function DataTable({ head, rows }) {
  return html`<details class="tbl"><summary>Werte als Tabelle</summary><div class="tablewrap"><table>
    <thead><tr>${head.map((h, i) => html`<th class=${i ? 'n' : ''}>${h}</th>`)}</tr></thead>
    <tbody>${rows.map(r => html`<tr>${r.map((c, i) => html`<td class=${i ? 'n' : ''}>${c}</td>`)}</tr>`)}</tbody></table></div></details>`;
}


/* ---------- first start: plan setup ---------- */

function Onboarding() {
  const [step, setStep] = useState(0);
  const [o, setO] = useState({ kraft: true, kampf: false, cardio: false, act: 'Laufen', preset: 'pp', legs: true, bw: 75 });
  const [draft, setDraft] = useState(null);
  const fileRef = useRef(null);
  const set = (k, v) => setO({ ...o, [k]: v });
  const steps = o.kraft ? ['typ', 'vorlage', 'woche'] : ['typ', 'woche'];
  const cur = step === 0 ? 'start' : steps[step - 1];
  const toWeek = () => { setDraft(buildPlan({ ...o, preset: o.kraft ? o.preset : null })); setStep(steps.length); };
  const next = () => { if (step === steps.length - 1) toWeek(); else setStep(step + 1); };
  const P = PRESETS[o.preset];
  return html`<div class="ob">
    <div class="row between"><div class="mark">${I.mark}<span>Formkurve</span></div>
      ${S.prevSettings && html`<button class="btn sm ghost" onClick=${() => { S.settings = S.prevSettings; S.prevSettings = null; commit(); }}>Abbrechen</button>`}</div>
    ${step > 0 && html`<div class="segbar" aria-hidden="true">${steps.map((x, i) => html`<i class=${i < step ? 'on t-push' : ''}></i>`)}</div>`}

    ${cur === 'start' && html`<div class="stack" style="gap:18px;margin-top:6vh">
      <h1 class="ob-hero">Dein Training. Deine Kurve.</h1>
      <p class="muted" style="margin:0;font-size:17px;max-width:36ch">Stell deinen Plan einmal ein, dann sagt dir Formkurve bei jeder Übung, was heute dran ist.</p>
      <ul class="steps-ol muted small" style="list-style:none;padding:0">
        <li>Gewicht und Wiederholungen mit Double Progression</li><li>Pausentimer, Rundentimer und Scheibenrechner</li><li>Verlauf, Rekorde und Kraftkurven. Alles offline, nur auf deinem Gerät.</li></ul>
      <button class="btn primary block" onClick=${() => setStep(1)}>Plan einrichten</button>
      <button class="btn ghost block" onClick=${() => fileRef.current && fileRef.current.click()}>Backup laden</button>
      <input id="ob-import" ref=${fileRef} type="file" accept=".json,application/json" hidden onChange=${e => { const f = e.target.files && e.target.files[0]; if (f) importJSON(f); e.target.value = ''; }} />
    </div>`}

    ${cur === 'typ' && html`<div class="stack">
      <h1 class="h1" style="font-size:40px">Was trainierst du?</h1><p class="muted" style="margin:0">Mehrfachauswahl möglich.</p>
      <${Opt} on=${o.kraft} color="push" title="Krafttraining" desc="Hanteln, Maschinen, Körpergewicht" onClick=${() => set('kraft', !o.kraft)} />
      <${Opt} on=${o.kampf} color="box" title="Kampfsport" desc="Runden am Sack, an den Pratzen oder im Sparring" onClick=${() => set('kampf', !o.kampf)} />
      <${Opt} on=${o.cardio} color="run" title="Ausdauer" desc="Laufen, Radfahren, Schwimmen, Rudern" onClick=${() => set('cardio', !o.cardio)} />
      ${o.cardio && html`<div class="field"><span>Hauptsportart Ausdauer</span><div class="chips">${Object.keys(ACTS).map(x => html`<button class=${'chip' + (o.act === x ? ' on' : '')} onClick=${() => set('act', x)}>${x}</button>`)}</div></div>`}
    </div>`}

    ${cur === 'vorlage' && html`<div class="stack">
      <h1 class="h1" style="font-size:40px">Wähle eine Vorlage</h1><p class="muted" style="margin:0">Übungen, Sätze und Tage kannst du danach jederzeit ändern.</p>
      ${Object.entries(PRESETS).map(([k, p]) => html`<${Opt} on=${o.preset === k} title=${p.name} desc=${p.desc} onClick=${() => set('preset', k)} />`)}
      ${P && P.legsToggle && html`<div class="card flat" style="padding:4px 16px"><${Toggle} on=${o.legs} label="Beine im Gym trainieren" hint="Aus, wenn du die Beine anders abdeckst, z. B. mit Laufen oder Kampfsport" onChange=${v => set('legs', v)} /></div>`}
    </div>`}

    ${step === steps.length && draft && html`<div class="stack">
      <h1 class="h1" style="font-size:40px">Deine Woche</h1><p class="muted" style="margin:0">Tippe die Einheiten pro Tag an. Tage ohne Einheit sind Ruhetage.</p>
      <div class="card stack" style="gap:2px">${DAY_L.map((dn, i) => html`<div class="row" style="padding:8px 0;border-top:${i ? '1px solid var(--line-2)' : '0'};align-items:flex-start">
        <span style="width:34px;font-weight:700;padding-top:7px">${DAY_S[i]}</span>
        <div class="chips grow">${draft.templates.map(t => { const on = draft.week[i].includes(t.id); return html`<button class=${'chip c t-' + t.color + (on ? ' on' : '')} aria-pressed=${on ? 'true' : 'false'} aria-label=${dn + ': ' + t.name}
          onClick=${() => { draft.week[i] = on ? draft.week[i].filter(x => x !== t.id) : [...draft.week[i], t.id]; setDraft({ ...draft }); }}>${t.name}</button>`; })}</div></div>`)}</div>
      ${o.kraft && html`<label class="field"><span>Körpergewicht in kg (für Klimmzüge, Dips und Co.)</span><${NumInput} id="ob-bw" value=${o.bw} onChange=${v => set('bw', v)} /></label>`}
    </div>`}

    ${step > 0 && html`<div class="row" style="gap:10px;margin-top:auto;padding-top:10px">
      <button class="btn ghost" onClick=${() => setStep(step - 1)}>Zurück</button>
      ${step < steps.length ? html`<button class="btn primary grow" disabled=${!o.kraft && !o.kampf && !o.cardio} onClick=${next}>Weiter</button>`
        : html`<button class="btn primary grow" onClick=${() => { draft.prefs.bw = o.bw || 75; if (S.prevSettings) { draft.prefs = { ...S.prevSettings.prefs, bw: draft.prefs.bw }; } S.prevSettings = null; finishOnboarding(draft); toast('Plan steht. Viel Erfolg!'); }}>Los geht’s</button>`}
    </div>`}
  </div>`;
}

/* ---------- exercise library picker ---------- */
function LibrarySheet({ title, exclude = [], onPick, onClose }) {
  const [q, setQ] = useState(''); const [g, setG] = useState(''); const [eq, setEq] = useState('');
  const [cn, setCn] = useState(''); const [cg, setCg] = useState('Brust'); const [ce, setCe] = useState('Kurzhantel'); const [ct, setCt] = useState(null);
  const norm = x => String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');
  const own = [];
  if (S.settings) S.settings.templates.forEach(t => (t.exercises || []).forEach(e => { if (!libEx(e.id) && !own.some(x => x.id === e.id)) own.push({ ...e, eq: e.bw ? 'Körpergewicht' : '', own: true }); }));
  exerciseIndex(S.sessions).forEach(x => { if (!libEx(x.id) && !own.some(y => y.id === x.id)) own.push({ ...exd(x.id, x.name, 3, 8, 12, 2.5, 90, { bw: x.bw }), eq: '', own: true }); });
  const match = x => !exclude.includes(x.id) && (!g || x.group === g) && (!eq || x.eq === eq) && (!q || norm(x.name).includes(norm(q)));
  const list = [...own.filter(match), ...LIB.filter(match)];
  const pick = x => onPick(x.own ? { ...exd(x.id, x.name, x.sets || 3, x.lo || 8, x.hi || 12, x.inc || 2.5, x.rest || 90, { bar: x.bar, bw: x.bw, group: x.group, typ: exTyp(x) }) } : exFromLib(x.id));
  const typ = ct || (['Langhantel', 'Körpergewicht', 'Kettlebell'].includes(ce) ? 'grund' : 'iso');
  const addCustom = () => {
    const name = cn.trim(); if (!name) return;
    const bar = ce === 'Langhantel', bw = ce === 'Körpergewicht';
    onPick(exd(uid('ex_'), name, 3, 8, 12, bar ? 2.5 : 2, typ === 'grund' ? 120 : 90, { bar, bw, group: cg, typ }));
  };
  return html`<${Sheet} onClose=${onClose} label=${title}>
    <div class="row between"><h2 class="h2">${title}</h2><button class="iconbtn" aria-label="Schließen" onClick=${onClose}>${I.x}</button></div>
    <input id="lib-search" class="inp" type="search" placeholder="Übung suchen" value=${q} onInput=${e => setQ(e.target.value)} />
    <div class="hscroll" role="group" aria-label="Muskelgruppe">${['', ...GROUPS].map(x => html`<button class=${'chip' + (g === x ? ' on' : '')} onClick=${() => setG(x)}>${x || 'Alle'}</button>`)}</div>
    <div class="hscroll" role="group" aria-label="Gerät">${['', ...EQUIP].map(x => html`<button class=${'chip' + (eq === x ? ' on' : '')} onClick=${() => setEq(x)}>${x || 'Jedes Gerät'}</button>`)}</div>
    <div>${list.length ? list.map(x => html`<button class="lib-row" key=${x.id} onClick=${() => pick(x)}>
        <span><b style="font-weight:600">${x.name}</b><div class="tiny faint">${x.own ? 'Eigene Übung' : x.group + ' · ' + x.eq} · ${x.sets || 3}×${x.lo || 8}–${x.hi || 12}</div></span>
        <span class="plus" aria-hidden="true">${I.plus}</span></button>`)
      : html`<p class="small muted">Nichts gefunden. Leg die Übung unten selbst an.</p>`}</div>
    <div class="card flat stack" style="gap:10px"><b class="h3">Eigene Übung</b>
      <input id="lib-custom-name" class="inp" placeholder="Name, z. B. Turkish Get-up" value=${cn} onInput=${e => setCn(e.target.value)} />
      <div class="grid2">
        <label class="field"><span>Muskelgruppe</span><select id="lib-custom-group" class="inp" value=${cg} onChange=${e => setCg(e.target.value)}>${GROUPS.map(x => html`<option value=${x}>${x}</option>`)}</select></label>
        <label class="field"><span>Gerät</span><select id="lib-custom-eq" class="inp" value=${ce} onChange=${e => setCe(e.target.value)}>${EQUIP.map(x => html`<option value=${x}>${x}</option>`)}</select></label>
      </div>
      <div class="field"><span>Art</span><div class="seg" role="group" aria-label="Art der Übung">${[['grund', 'Grundübung'], ['iso', 'Isolation']].map(([k, l]) => html`<button class=${typ === k ? 'on' : ''} aria-pressed=${typ === k ? 'true' : 'false'} onClick=${() => setCt(k)}>${l}</button>`)}</div></div>
      <button class="btn primary" disabled=${!cn.trim()} onClick=${addCustom}>Hinzufügen</button></div>
  </${Sheet}>`;
}

/* ---------- statistics ---------- */
function Stats() {
  const [range, setRange] = useState(() => Number(lsGet('formkurve.range')) || 12);
  const [exSel, setExSel] = useState(null);
  const [actSel, setActSel] = useState(null);
  const src = S.demo || S.sessions;
  if (!Object.keys(src).length) return html`<div class="stack"><h1 class="h1" style="font-size:40px;margin-top:4px">Statistik</h1>
    <div class="card empty"><div class="h2">Noch keine Daten</div>
      <p class="small muted" style="margin:0;max-width:36ch">Nach deinen ersten Einheiten siehst du hier Konstanz, Wochenpensum, Kraftkurven pro Übung, Kilometer, Runden und Rekorde.</p>
      <button class="btn primary" onClick=${() => { S.demo = makeDemo(); commit(); }}>Beispielansicht zeigen</button></div></div>`;
  const st = computeStats(src, range);
  const exIdx = exerciseIndex(src);
  const exId = exSel && exIdx.some(x => x.id === exSel) ? exSel : exIdx[0] && exIdx[0].id;
  const exInfo = exIdx.find(x => x.id === exId);
  const series = exId ? exerciseSeries(src, exId).filter(p => p.date >= dkey(st.from)) : [];
  const exColor = (() => { for (const s of sortedSessions(src)) if (s.kind === 'kraft' && (s.ex || []).some(e => e.id === exId)) return s.color; return 'push'; })();
  const keys = COLORS.filter(k => st.weeks.some(w => w.byColor[k] > 0));
  const cols = st.weeks.map(w => ({ label: String(w.kw), tip: 'KW ' + w.kw, parts: w.byColor, total: keys.reduce((n, k) => n + (w.byColor[k] || 0), 0) }));
  const runs = st.list.filter(s => s.kind === 'lauf'), fights = st.list.filter(s => s.kind === 'boxen');
  const acts = [...new Set(runs.map(s => s.run.act || 'Laufen'))];
  const act = actSel && acts.includes(actSel) ? actSel : acts[0];
  const actRuns = runs.filter(s => (s.run.act || 'Laufen') === act);
  const actWeeks = st.weeks.map(() => 0); actRuns.forEach(s => { const i = weekIndex(s, st.from); if (actWeeks[i] != null) actWeeks[i] += s.run.km || 0; });
  const actColor = (actRuns[0] && actRuns[0].color) || 'run';
  const bestPace = actRuns.filter(s => s.run.km >= 3).reduce((m, s) => Math.min(m, s.run.sec / s.run.km || 1e9), 1e9);
  const bestRate = bestPace < 1e9 ? cardioRate({ act, km: 1, sec: bestPace }) : null;
  const fightColor = (fights[0] && fights[0].color) || 'box';
  const delta = series.length > 1 ? (series[series.length - 1].y - series[0].y) / series[0].y : null;
  const setR = r => { setRange(r); lsSet('formkurve.range', String(r)); };
  return html`<div class="stack">

    ${S.demo && html`<div class="banner"><span><b>Beispieldaten.</b> Nicht deine Werte, nichts davon wird gespeichert.</span><button class="btn sm" onClick=${() => { S.demo = null; commit(); }}>Ausblenden</button></div>`}
    <div class="tiles">
      <div class="tile"><span class="eyebrow">Einheiten</span><b>${st.count}</b><span class="tiny faint">Ø ${fmt1(st.perWeek)} pro Woche</span></div>
      <div class="tile"><span class="eyebrow">Volumen Kraft</span><b>${fmt1(st.vol / 1000)}<small>t</small></b><span class="tiny faint">Gewicht × Wiederholungen</span></div>
      <div class="tile"><span class="eyebrow">Ausdauer</span><b>${fmt1(st.km)}<small>km</small></b><span class="tiny faint">${runs.length} Einheiten · ${fmtMin(st.runSec)}</span></div>
      <div class="tile"><span class="eyebrow">Kampfsport</span><b>${st.rounds}<small>Runden</small></b><span class="tiny faint">${fmtInt(fights.reduce((n, s) => n + (s.box.rounds || 0) * (s.box.round || 0), 0) / 60)} min Rundenzeit</span></div>
    </div>

    <section class="card stack" style="gap:12px"><div class="row between"><h2 class="h3">Konstanz</h2><span class="tiny faint">Tippe auf einen Tag</span></div>
      <${Heatmap} src=${src} from=${st.from} n=${range} key=${'hm' + range} />
      ${keys.length ? html`<${Legend} keys=${keys} />` : null}</section>

    <section class="card stack" style="gap:12px"><h2 class="h3">Einheiten pro Woche</h2>
      ${keys.length ? html`<${Columns} cols=${cols} keys=${keys} fmt=${fmtInt} label="Einheiten pro Woche nach Einheit" key=${'c' + range} /><${Legend} keys=${keys} />
        <${DataTable} head=${['KW', ...keys.map(colorName), 'Summe']} rows=${cols.map(c => [c.label, ...keys.map(k => c.parts[k] || 0), c.total])} />` : html`<p class="small muted" style="margin:0">Keine Einheiten in diesem Zeitraum.</p>`}</section>

    ${exIdx.length ? html`<section class="card stack" style="gap:12px">
      <div class="row between wrap"><h2 class="h3">Kraftkurve</h2><span class="tiny faint">geschätztes 1RM pro Einheit</span></div>
      <select id="stats-ex" class="inp" value=${exId} onChange=${e => setExSel(e.target.value)} aria-label="Übung wählen">${exIdx.map(x => html`<option value=${x.id}>${x.name}</option>`)}</select>
      ${series.length ? html`<${LineChart} pts=${series} color=${exColor} fmt=${fmt1} unit=" kg" label=${'1RM-Verlauf ' + (exInfo ? exInfo.name : '')} key=${exId + range} />
        <div class="grid3">
          <div><div class="eyebrow">Aktuell</div><div class="data" style="font-size:16px;margin-top:3px">${fmt1(series[series.length - 1].y)} kg</div></div>
          <div><div class="eyebrow">Bestwert</div><div class="data" style="font-size:16px;margin-top:3px">${fmt1(exInfo.best)} kg</div></div>
          <div><div class="eyebrow">Zeitraum</div><div class=${'data' + (delta > 0 ? ' up' : '')} style="font-size:16px;margin-top:3px">${delta == null ? '–' : (delta >= 0 ? '+' : '') + fmt1(delta * 100) + ' %'}</div></div>
        </div>
        ${exInfo && exInfo.bw ? html`<p class="tiny faint" style="margin:0">Mit ${fmtKg(pref('bw'))} kg Körpergewicht gerechnet (änderbar unter Plan).</p>` : null}
        <${DataTable} head=${['Datum', '1RM (kg)', 'Bester Satz']} rows=${series.slice().reverse().map(p => [dateShort(p.date), fmt1(p.y), p.set ? (p.bw && !p.set.w ? 'KG' : fmtKg(p.set.w)) + ' × ' + p.set.r : '–'])} />`
        : html`<p class="small muted" style="margin:0">Keine Einträge für diese Übung in diesem Zeitraum.</p>`}
    </section>` : null}

    ${runs.length ? html`<section class=${'card stack t-' + actColor} style="gap:12px"><div class="row between"><h2 class="h3">${act}: km pro Woche</h2><span class="tiny faint">${actRuns.length} Einheiten</span></div>
      ${acts.length > 1 && html`<div class="chips">${acts.map(x => html`<button class=${'chip' + (x === act ? ' on' : '')} onClick=${() => setActSel(x)}>${x}</button>`)}</div>`}
      <${Columns} cols=${st.weeks.map((w, i) => ({ label: String(w.kw), tip: 'KW ' + w.kw, parts: { [actColor]: actWeeks[i] }, total: actWeeks[i] }))} keys=${[actColor]} fmt=${fmt1} unit=" km" label=${act + ' Kilometer pro Woche'} key=${'r' + range + act} />
      <div class="grid2"><div><div class="eyebrow">Bestwert ab 3 km</div><div class="data" style="font-size:16px;margin-top:3px">${bestRate ? bestRate.main + ' ' + bestRate.unit : '–'}</div></div>
        <div><div class="eyebrow">Längste Einheit</div><div class="data" style="font-size:16px;margin-top:3px">${fmt1(Math.max(0, ...actRuns.map(s => s.run.km || 0)))} km</div></div></div></section>` : null}

    ${fights.length ? html`<section class=${'card stack t-' + fightColor} style="gap:12px"><div class="row between"><h2 class="h3">Kampfsport: Runden pro Woche</h2><span class="tiny faint">${fights.length} Einheiten</span></div>
      <${Columns} cols=${st.weeks.map(w => ({ label: String(w.kw), tip: 'KW ' + w.kw, parts: { [fightColor]: w.rounds }, total: w.rounds }))} keys=${[fightColor]} fmt=${fmtInt} unit=" Rd." label="Kampfsportrunden pro Woche" key=${'b' + range} /></section>` : null}

    ${exIdx.length ? html`<section class="card stack" style="gap:8px"><h2 class="h3">Rekorde</h2>
      <div class="tablewrap" style="margin:0"><table><thead><tr><th>Übung</th><th class="n">1RM</th><th class="n">Satz</th><th class="n">Datum</th></tr></thead>
      <tbody>${exIdx.map(x => html`<tr><td style="padding-left:0;white-space:normal">${x.name}</td><td class="n">${fmt1(x.best)}</td><td class="n">${x.bestSet ? (x.bw && !x.bestSet.w ? 'KG' : fmtKg(x.bestSet.w)) + '×' + x.bestSet.r : '–'}</td><td class="n" style="padding-right:0">${x.bestDate ? dateShort(x.bestDate).slice(4) : ''}</td></tr>`)}</tbody></table></div></section>` : null}
  </div>`;
}

/* ---------- plan & settings ---------- */
const KIND_L = { kraft: 'Kraft', boxen: 'Kampfsport', lauf: 'Ausdauer' };
function Plan() {
  const st = S.settings, p = st.prefs, fileRef = useRef(null);
  const setPref = (k, v) => { p[k] = v; saveSettings(); };
  const addTpl = kind => {
    const used = st.templates.map(t => t.color), color = COLORS.find(c => !used.includes(c)) || (kind === 'boxen' ? 'box' : kind === 'lauf' ? 'run' : 'push');
    const t = { id: uid('t_'), name: kind === 'kraft' ? 'Neue Einheit' : kind === 'boxen' ? 'Kampfsport' : 'Ausdauer', kind, color, focus: '' };
    if (kind === 'kraft') t.exercises = []; if (kind === 'boxen') t.box = { ...BOX_DEF }; if (kind === 'lauf') t.run = { ...RUN_DEF };
    st.templates.push(t); saveSettings(); S.sheet = { type: 'tpl', id: t.id }; commit();
  };
  const lb = S.meta.lastBackup;
  return html`<div class="stack">
    <h1 class="h1" style="font-size:40px;margin-top:4px">Plan</h1>
    <section class="card stack" style="gap:4px"><h2 class="h3" style="margin-bottom:6px">Wochenplan</h2>
      ${DAY_L.map((dn, i) => html`<div class="row" style="padding:8px 0;border-top:${i ? '1px solid var(--line-2)' : '0'};align-items:flex-start">
        <span style="width:34px;font-weight:700;padding-top:7px">${DAY_S[i]}</span>
        <div class="chips grow">${st.templates.map(t => { const on = st.week[i].includes(t.id); return html`<button class=${'chip c t-' + t.color + (on ? ' on' : '')} aria-pressed=${on ? 'true' : 'false'} aria-label=${dn + ': ' + t.name}
          onClick=${() => { st.week[i] = on ? st.week[i].filter(x => x !== t.id) : [...st.week[i], t.id]; saveSettings(); }}>${t.name}</button>`; })}</div></div>`)}
    </section>
    <section class="card stack" style="gap:2px"><h2 class="h3" style="margin-bottom:6px">Einheiten</h2>
      <div class="list">${st.templates.map(t => html`<button class=${'li t-' + t.color} onClick=${() => { S.sheet = { type: 'tpl', id: t.id }; commit(); }}>
        <span class="disc"></span><span class="grow"><b class="h3">${t.name}</b><div class="tiny faint">${KIND_L[t.kind]} · ${t.kind === 'kraft' ? t.exercises.length + ' Übungen' : t.kind === 'boxen' ? t.box.rounds + ' × ' + fmtDur(t.box.round) : (t.run.act || 'Laufen') + ', Ziel ' + fmt1(t.run.km) + ' km'}</div></span>
        <span class="r faint">Bearbeiten</span></button>`)}</div>
      <div class="row wrap" style="gap:8px;margin-top:8px"><button class="btn sm" onClick=${() => addTpl('kraft')}>+ Kraft</button><button class="btn sm" onClick=${() => addTpl('boxen')}>+ Kampfsport</button><button class="btn sm" onClick=${() => addTpl('lauf')}>+ Ausdauer</button></div>
    </section>
    <section class="card stack" style="gap:6px"><h2 class="h3">Einstellungen</h2>
      <div class="field" style="padding:6px 0"><span>Design</span><div class="seg">${[['system', 'System'], ['light', 'Hell'], ['dark', 'Dunkel']].map(([k, l]) => html`<button class=${p.theme === k ? 'on' : ''} onClick=${() => { setPref('theme', k); applyTheme(); }}>${l}</button>`)}</div></div>
      <${Toggle} on=${p.sound} label="Töne" hint="Pausenende, Gong im Rundentimer" onChange=${v => { setPref('sound', v); if (v) { unlockAudio(); beep([880], 0.1); } }} />
      <hr class="hr" /><${Toggle} on=${p.vibrate} label="Vibration" hint="Auf Android; iPhones unterstützen das im Browser nicht" onChange=${v => setPref('vibrate', v)} />
      <hr class="hr" />
      <div class="grid2" style="padding-top:8px">
        <label class="field"><span>Körpergewicht (kg)</span><${NumInput} id="pref-bw" value=${p.bw} onChange=${v => setPref('bw', v || 0)} /></label>
        <label class="field"><span>Langhantelstange (kg)</span><${NumInput} id="pref-bar" value=${p.bar} onChange=${v => setPref('bar', v || 20)} /></label>
      </div>
      <p class="tiny faint" style="margin:4px 0 0">Das Körpergewicht zählt bei Klimmzügen, Dips und Co. für 1RM und Volumen mit.</p>
    </section>
    <section class="card stack" style="gap:6px"><h2 class="h3">Erweitert</h2>
      <${Toggle} on=${p.restAuto !== false} label="Pausentimer automatisch starten" hint="Startet nach jedem abgehakten Satz. Aus: kein Timer, du trainierst nach Gefühl." onChange=${v => setPref('restAuto', v)} />
      <hr class="hr" /><${Toggle} on=${!!p.restByReps} label="Pause nach Wiederholungsbereich" hint="Aus: feste Pause pro Übung, im Training über „Pause“ oder hier im Plan einstellbar." onChange=${v => setPref('restByReps', v)} />
      ${p.restByReps && html`<div class="tablewrap" style="margin:0 0 6px"><table><thead><tr><th>Wdh.</th><th class="n">Grundübung</th><th class="n">Isolation</th></tr></thead><tbody>
        ${REST_TABLE.map(([l, , g, i]) => html`<tr><td style="padding-left:0">${l}</td><td class="n">${fmtDur(g)}</td><td class="n" style="padding-right:0">${fmtDur(i)}</td></tr>`)}</tbody></table>
        <p class="tiny faint" style="margin:6px 0 0">Grundübungen wie Bankdrücken, Kniebeuge oder Rudern beanspruchen viel Muskelmasse und brauchen länger als Isolationsübungen wie Curls oder Seitheben. Maßgeblich ist der untere Wert des Bereichs: Bankdrücken mit 6–10 Wdh. bekommt 2:30.</p></div>`}
      <hr class="hr" /><${Toggle} on=${p.carryW !== false} label="Gewicht in die nächsten Sätze übernehmen" hint="Nach dem ersten Satz stehen die kg schon in den folgenden Sätzen." onChange=${v => setPref('carryW', v)} />
    </section>
    <section class="card stack" style="gap:10px"><h2 class="h3">Daten</h2>
      <p class="small muted" style="margin:0">Alles liegt nur auf diesem Gerät, ohne Konto und ohne Server. ${lb ? 'Letztes Backup: ' + dateShort(dkey(new Date(lb))) + '.' : 'Noch kein Backup.'}${S.meta.persisted ? ' Speicher ist vor automatischem Löschen geschützt.' : ''}</p>
      <div class="grid2">
        <button class="btn sm primary" onClick=${exportJSON}>Backup sichern</button>
        <button class="btn sm" onClick=${() => fileRef.current && fileRef.current.click()}>Backup laden</button>
        <button class="btn sm" onClick=${() => shareText(textExport(), 'Formkurve-Protokoll')}>Als Text teilen</button>
        ${!S.standalone ? html`<button class="btn sm" onClick=${installApp}>App installieren</button>` : html`<span></span>`}
      </div>
      <input id="import-file" ref=${fileRef} type="file" accept=".json,application/json" hidden onChange=${e => { const f = e.target.files && e.target.files[0]; if (f) importJSON(f); e.target.value = ''; }} />
      <hr class="hr" />
      <div class="row wrap between" style="gap:8px">
        <${Confirm} label="Plan neu einrichten" yes="Neu einrichten" danger=${false} onYes=${() => { S.prevSettings = S.settings; S.settings = null; S.tab = 'heute'; commit(); }} />
        <${Confirm} label="Alles löschen" yes="Ja, alles löschen" onYes=${resetAll} />
      </div>
      <p class="tiny faint" style="margin:0">„Plan neu einrichten“ behält deine Einheiten im Verlauf.</p>
    </section>
    <p class="tiny faint" style="text-align:center;margin:6px 0 0">Double Progression: Das Gewicht bleibt, bis alle Sätze das obere Ende des Bereichs erreichen. Dann steigt es um die eingestellte Stufe. · Formkurve 1.1</p>
  </div>`;
}
function TplSheet({ id, openId, onClose }) {
  const st = S.settings, t = tpl(id); const [openEx, setOpenEx] = useState(openId || null);
  if (!t) return null;
  const ch = () => saveSettings();
  const move = (i, d) => { const a = t.exercises, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; ch(); };
  return html`<${Sheet} onClose=${onClose} label=${'Einheit ' + t.name}>
    <div class=${'row t-' + t.color}><span class="disc lg"></span><input id=${'tpl-name-' + t.id} class="inp grow" style="font:800 26px var(--font-display);text-transform:uppercase" value=${t.name} aria-label="Name" onInput=${e => { t.name = e.target.value; ch(); }} /></div>
    <div class="field"><span>Farbe</span><div class="chips">${COLORS.map(c => html`<button class=${'chip c t-' + c + (t.color === c ? ' on' : '')} onClick=${() => { t.color = c; ch(); }}><span class="disc sm"></span>${COLOR_NAMES[c]}</button>`)}</div></div>
    <label class="field"><span>Fokus</span><input id=${'tpl-focus-' + t.id} class="inp" value=${t.focus || ''} placeholder="z. B. Brust · Schultern · Trizeps" onInput=${e => { t.focus = e.target.value; ch(); }} /></label>
    ${t.kind === 'kraft' && html`<div class="stack" style="gap:0">
      <div class="eyebrow" style="margin-bottom:4px">Übungen</div>
      ${!t.exercises.length && html`<p class="small muted" style="margin:6px 0">Noch keine Übungen. Füge welche aus der Bibliothek hinzu.</p>`}
      ${t.exercises.map((e, i) => html`<div class="edit-ex" key=${e.id}>
        <div class="row"><button class="grow" style="text-align:left" aria-expanded=${openEx === e.id ? 'true' : 'false'} onClick=${() => setOpenEx(openEx === e.id ? null : e.id)}>
          <b>${e.name || 'Ohne Namen'}</b><div class="tiny faint data" style="letter-spacing:0">${e.sets} × ${e.lo}–${e.hi} · +${fmtKg(e.inc)} kg · Pause ${fmtDur(restFor(e))} · ${exTyp(e) === 'grund' ? 'Grund' : 'Iso'}${e.bar ? ' · Stange' : ''}${e.bw ? ' · KG' : ''}</div></button>
          <button class="iconbtn" aria-label="nach oben" disabled=${i === 0} onClick=${() => move(i, -1)}>${I.arrowU}</button>
          <button class="iconbtn" aria-label="nach unten" disabled=${i === t.exercises.length - 1} onClick=${() => move(i, 1)}>${I.down}</button></div>
        ${openEx === e.id && html`<div class="stack" style="gap:10px">
          <label class="field"><span>Name</span><input id=${'ex-name-' + e.id} class="inp" value=${e.name} onInput=${ev => { e.name = ev.target.value; ch(); }} /></label>
          <div class="field"><span>Art</span><div class="seg" role="group" aria-label="Art der Übung">${[['grund', 'Grundübung'], ['iso', 'Isolation']].map(([k, l]) => html`<button class=${exTyp(e) === k ? 'on' : ''} aria-pressed=${exTyp(e) === k ? 'true' : 'false'} onClick=${() => { e.typ = k; ch(); }}>${l}</button>`)}</div></div>
          <div class="grid3">
            <label class="field"><span>Sätze</span><${Stepper} label="Sätze" value=${e.sets} min=${1} max=${10} onChange=${v => { e.sets = v; ch(); }} /></label>
            <label class="field"><span>Wdh. von</span><${Stepper} label="Wiederholungen von" value=${e.lo} min=${1} max=${e.hi} onChange=${v => { e.lo = v; ch(); }} /></label>
            <label class="field"><span>bis</span><${Stepper} label="Wiederholungen bis" value=${e.hi} min=${e.lo} max=${50} onChange=${v => { e.hi = v; ch(); }} /></label>
            <label class="field"><span>Stufe (kg)</span><${Stepper} label="Steigerung" value=${e.inc} min=${0.5} max=${10} step=${0.5} fmt=${fmtKg} onChange=${v => { e.inc = v; ch(); }} /></label>
            ${pref('restByReps') ? html`<div class="field"><span>Pause</span><div class="inp num" style="display:grid;place-items:center;font-size:14px">auto ${fmtDur(restFor(e))}</div></div>`
              : html`<label class="field"><span>Pause</span><${Stepper} label="Pause" value=${e.rest} min=${15} max=${600} step=${15} fmt=${fmtDur} onChange=${v => { e.rest = v; ch(); }} /></label>`}
            <label class="field"><span>Startgewicht</span><${NumInput} id=${'ex-start-' + e.id} value=${e.start} placeholder="kg" onChange=${v => { e.start = v; ch(); }} /></label>
          </div>
          <${Toggle} on=${e.bar} label="Langhantel" hint="Zeigt den Scheibenrechner" onChange=${v => { e.bar = v; ch(); }} />
          <${Toggle} on=${e.bw} label="Körpergewicht" hint="Eingetragenes Gewicht zählt als Zusatzgewicht" onChange=${v => { e.bw = v; ch(); }} />
          <${Confirm} label="Übung entfernen" yes="Entfernen" onYes=${() => { t.exercises.splice(i, 1); ch(); }} />
        </div>`}
      </div>`)}
      <button class="btn sm" style="margin-top:10px;align-self:flex-start" onClick=${() => { S.sheet = { type: 'libTpl', id: t.id }; commit(); }}>+ Übung aus der Bibliothek</button>
    </div>`}
    ${t.kind === 'boxen' && html`<div class="grid2">
      <label class="field"><span>Runden</span><${Stepper} label="Runden" value=${t.box.rounds} min=${1} max=${30} onChange=${v => { t.box.rounds = v; ch(); }} /></label>
      <label class="field"><span>Rundenlänge</span><${Stepper} label="Rundenlänge" value=${t.box.round} min=${30} max=${600} step=${30} fmt=${fmtDur} onChange=${v => { t.box.round = v; ch(); }} /></label>
      <label class="field"><span>Pause</span><${Stepper} label="Pause" value=${t.box.rest} min=${0} max=${300} step=${15} fmt=${fmtDur} onChange=${v => { t.box.rest = v; ch(); }} /></label>
      <label class="field"><span>Warnsignal</span><${Stepper} label="Warnsignal" value=${t.box.warn} min=${0} max=${30} step=${5} fmt=${v => (v ? v + ' s' : 'aus')} onChange=${v => { t.box.warn = v; ch(); }} /></label></div>`}
    ${t.kind === 'lauf' && html`<div class="grid2">
      <label class="field"><span>Sportart</span><select id=${'run-act-' + t.id} class="inp" value=${t.run.act || 'Laufen'} onChange=${e => { t.run.act = e.target.value; ch(); }}>${Object.keys(ACTS).map(a => html`<option value=${a}>${a}</option>`)}</select></label>
      <label class="field"><span>Art</span><select id=${'run-art-' + t.id} class="inp" value=${t.run.art} onChange=${e => { t.run.art = e.target.value; ch(); }}>${RUN_ARTS.map(a => html`<option value=${a}>${a}</option>`)}</select></label>
      <label class="field"><span>Ziel (km)</span><${NumInput} id=${'run-goal-' + t.id} value=${t.run.km} onChange=${v => { t.run.km = v || 0; ch(); }} /></label></div>`}
    <div class="row between wrap" style="gap:8px">
      ${st.templates.length > 1 ? html`<${Confirm} label="Einheit löschen" yes="Löschen" onYes=${() => { st.templates = st.templates.filter(x => x.id !== t.id); st.week = st.week.map(a => a.filter(x => x !== t.id)); saveSettings(); onClose(); }} />` : html`<span></span>`}
      <button class="btn primary" onClick=${onClose}>Fertig</button></div>
  </${Sheet}>`;
}

render(html`<${App} />`, document.getElementById('app'));

</script>
</body>
</html>
