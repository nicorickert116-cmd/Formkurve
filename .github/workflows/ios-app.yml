name: iPhone-App bauen
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Mac-Runner (macos-15 oder macos-15-intel, falls die anderen ausgelastet sind)'
        default: 'macos-15-intel'
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios-app.yml']
permissions:
  contents: write
concurrency:
  group: ios-app
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Neueste Xcode-Version wählen
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Werkzeug für das Xcode-Projekt (xcodeproj)
        run: |
          sudo gem install xcodeproj --no-document || gem install --user-install xcodeproj --no-document
          ruby -e 'require "xcodeproj"; puts "xcodeproj " + Xcodeproj::VERSION'
      - name: iOS-Projekt erzeugen und anpassen
        working-directory: app
        run: |
          npx cap add ios
          bash ios-patch.sh
          npx cap sync ios
      - name: App bauen (unsigniert, SideStore signiert beim Installieren)
        working-directory: app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then SRC=(-workspace App.xcworkspace); else SRC=(-project App.xcodeproj); fi
          xcodebuild "${SRC[@]}" -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 \
            || { grep -E "error:|fatal" build.log | head -80; tail -30 build.log; exit 1; }
          tail -15 build.log
          rm -rf Payload && mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          ls Payload/App.app/PlugIns
          test -f Payload/App.app/PlugIns/FKTimer.appex/FKTimer
          /usr/libexec/PlistBuddy -c "Print :NSExtension" Payload/App.app/PlugIns/FKTimer.appex/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" Payload/App.app/Info.plist
          zip -qry Formkurve.ipa Payload
          ls -la Formkurve.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Formkurve-iPhone-App
          path: app/ios/App/Formkurve.ipa
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-${{ github.run_number }}"
          gh release create "$TAG" app/ios/App/Formkurve.ipa --title "Formkurve iPhone-App ${TAG#app-}" \
            --notes "Installieren: Formkurve.ipa auf dem iPhone laden und in SideStore mit + hinzufügen." --latest
